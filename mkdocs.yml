site_name: laoyutong的学习笔记
site_description: 前端 / AI / 工具链 笔记
repo_url: https://github.com/laoyutong/blog-content

docs_dir: docs

theme:
  name: material
  language: zh
  font:
    text: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif
    code: JetBrains Mono, SF Mono, monospace
  features:
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: 切换深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: white
      toggle:
        icon: material/brightness-4
        name: 切换浅色模式

extra_css:
  - stylesheets/notion.css

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition
  - footnotes

plugins:
  - search:
      lang: zh
